<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Auto Electric">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Auto Electric Pro</title>
</head>
<body>
<header>
  <div>
    <h1>Auto Electric <b>Pro</b></h1>
    <p>كهرباء وتشخيص السيارة</p>
  </div>
  <span class="badge">Demo</span>
</header>

<main>
  <section class="hero">
    <div class="car">🚙⚡</div>
    <h2>لوحة فحص السيارة</h2>
    <p>راقب الأنظمة الكهربائية والبيانات الأساسية من مكان واحد.</p>
  </section>

  <section class="grid">
    <button class="card" onclick="showPage('battery')"><span>🔋</span><strong>البطارية</strong><small>12.6 V</small></button>
    <button class="card" onclick="showPage('alternator')"><span>⚡</span><strong>الدينمو</strong><small>14.2 V</small></button>
    <button class="card" onclick="showPage('temp')"><span>🌡️</span><strong>حرارة المحرك</strong><small>92 °C</small></button>
    <button class="card" onclick="showPage('obd')"><span>🛠️</span><strong>أعطال OBD-II</strong><small>قراءة الأكواد</small></button>
    <button class="card" onclick="showPage('live')"><span>📊</span><strong>البيانات الحية</strong><small>Live Data</small></button>
    <button class="card" onclick="showPage('reports')"><span>📄</span><strong>التقارير</strong><small>سجل الفحوصات</small></button>
  </section>

  <section id="panel" class="panel hidden">
    <button class="back" onclick="closePage()">✕</button>
    <div id="panelContent"></div>
  </section>

  <section class="notice">
    <strong>نسخة تجريبية</strong>
    <p>القراءات الحالية محاكاة للواجهة وليست بيانات حقيقية من السيارة. اتصال OBD-II المباشر عبر متصفح iPhone محدود.</p>
  </section>
</main>

<nav>
  <button onclick="closePage()">⌂<small>الرئيسية</small></button>
  <button onclick="showPage('live')">▥<small>البيانات</small></button>
  <button onclick="showPage('obd')">⚠<small>الأعطال</small></button>
  <button onclick="showPage('reports')">▤<small>التقارير</small></button>
</nav>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02070c">
  <title>alketbi Dashboard</title>
  <style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
}
button{font:inherit}
#wrap{
  width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;
  background:#02070c;
}
#board{
  position:relative;
  width:min(100vw,216.67vh);
  aspect-ratio:1846/852;
  overflow:hidden;
  background:#02070c;
}
#bg{
  position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;
}

/* ---------- Large gauges ----------
   The old painted gauges are covered by opaque live panels.
   These SVG paths are the ONLY moving indicators, so there is no shaded wedge. */
.large-live{
  position:absolute;z-index:5;
  background:radial-gradient(circle at 50% 42%,#0b293c 0%,#061a28 52%,#03131d 100%);
  border-radius:1.3vw;
  overflow:hidden;
  box-shadow:inset 0 0 18px rgba(0,130,220,.18);
}
.rpm-live{left:18.1%;top:32.3%;width:17.7%;height:19.9%}
.speed-live{left:64.6%;top:32.3%;width:18.2%;height:19.9%}

.large-arc{
  position:absolute;left:7%;top:9%;width:86%;height:64%;
}
.large-arc svg,.mini-arc svg{
  width:100%;height:100%;display:block;overflow:visible;
}
.arc-track,.arc-fill{
  fill:none;
  stroke-linecap:round;
}
.large-arc .arc-track{stroke:#173a5c;stroke-width:14}
.large-arc .arc-fill{
  stroke-width:14;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  transition:stroke-dashoffset .7s ease;
}
.rpm-live .arc-fill{stroke:#25e8aa;filter:drop-shadow(0 0 5px #25e8aa)}
.speed-live .arc-fill{stroke:#3bcaff;filter:drop-shadow(0 0 5px #3bcaff)}

.large-value{
  position:absolute;left:12%;right:12%;top:47%;
  text-align:center;color:#fff;font-weight:900;font-size:4.1vw;line-height:1;
  text-shadow:0 0 12px rgba(44,173,255,.7);
}
.large-unit{
  position:absolute;left:0;right:0;top:79%;
  text-align:center;color:#e7f6ff;font-size:1.32vw;font-weight:800;
}

/* ---------- Small gauges ---------- */
.small-live{
  position:absolute;z-index:5;
  height:14.8%;
  background:linear-gradient(180deg,#071c2a 0%,#041520 100%);
  border-radius:.75vw;
  overflow:hidden;
  box-shadow:inset 0 0 14px rgba(0,120,200,.12);
}
.temp-live{left:17.2%;top:59.2%;width:10.2%}
.batt-live{left:27.65%;top:59.2%;width:10.15%}
.alt-live{left:38.05%;top:59.2%;width:10.2%}
.fuel-live{left:48.55%;top:59.2%;width:10.1%}

.mini-arc{
  position:absolute;left:12%;top:4%;width:76%;height:62%;
}
.mini-arc .arc-track{stroke:#183b5e;stroke-width:13}
.mini-arc .arc-fill{
  stroke-width:13;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  transition:stroke-dashoffset .7s ease;
}
.temp-live .arc-fill,.batt-live .arc-fill,.alt-live .arc-fill{
  stroke:#24e9a6;filter:drop-shadow(0 0 4px #24e9a6);
}
.fuel-live .arc-fill{
  stroke:#42c9ff;filter:drop-shadow(0 0 4px #42c9ff);
}
.mini-value{
  position:absolute;left:7%;right:7%;top:62%;
  color:#fff;font-size:1.75vw;font-weight:900;text-align:center;white-space:nowrap;
  text-shadow:0 0 8px rgba(42,170,255,.55);
}

/* Invisible vehicle-brand tap zones */
.brand-hotspots{
  position:absolute;z-index:8;left:18.3%;top:14.9%;width:57.6%;height:8.0%;
}
.brand-hotspots button{
  position:absolute;top:0;height:100%;width:13.2%;left:calc(var(--x) * 14.3%);
  border:0;background:transparent;border-radius:.6vw;
}
.brand-hotspots button.active{
  outline:1px solid rgba(70,195,255,.22);
}

/* Invisible bottom controls. Real vehicle-control buttons remain DEMO ONLY. */
.hot{position:absolute;z-index:8;border:0;background:transparent}
.live{left:16.6%;top:82.2%;width:7.0%;height:13%}
.remote{left:49.0%;top:82.2%;width:7.2%;height:13%}
.lock{left:57.0%;top:82.2%;width:7.0%;height:13%}
.unlock{left:64.3%;top:82.2%;width:7.0%;height:13%}

.battery-controls{
  position:absolute;z-index:9;right:3.0%;top:58.1%;width:13.0%;height:5.3%;
  display:flex;align-items:center;justify-content:space-between;
  color:#fff;font-weight:800;
  background:rgba(5,22,34,.98);
  border:1px solid rgba(42,150,210,.32);
  border-radius:.45vw;
  padding:0 .25vw;
}
.battery-controls button{
  width:26%;height:100%;border:0;background:transparent;color:#fff;font-size:1.7vw;
}
#batteryLimit{font-size:1.05vw}

#demoBadge{display:none}
#toast{
  position:absolute;z-index:20;left:50%;bottom:4%;transform:translateX(-50%);
  background:rgba(2,14,24,.94);border:1px solid #1ca9ed;color:#e7f8ff;
  padding:.55vw 1vw;border-radius:.55vw;font-size:1vw;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
#toast.show{opacity:1}

.large-value,.large-unit,.mini-value,#batteryLimit{
  direction:ltr;
  unicode-bidi:isolate;
}

</style>
</head>

      <!-- Large clean live gauges: these opaque panels hide the old painted gauges -->
      <section class="large-live rpm-live" aria-label="RPM">
        <div class="large-arc">
          <svg viewBox="0 0 180 100" aria-hidden="true">
            <path class="arc-track" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
            <path id="rpmArc" class="arc-fill" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
          </svg>
        </div>
        <div id="rpmValue" class="large-value">1650</div>
        <div class="large-unit">RPM</div>
      </section>

      <section class="large-live speed-live" aria-label="Speed">
        <div class="large-arc">
          <svg viewBox="0 0 180 100" aria-hidden="true">
            <path class="arc-track" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
            <path id="speedArc" class="arc-fill" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
          </svg>
        </div>
        <div id="speedValue" class="large-value">72</div>
        <div class="large-unit">km/h</div>
      </section>

      <!-- Small clean live gauges -->
      <section class="small-live temp-live">
        <div class="mini-arc">
          <svg viewBox="0 0 180 100" aria-hidden="true">
            <path class="arc-track" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
            <path id="tempArc" class="arc-fill" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
          </svg>
        </div>
        <div id="tempValue" class="mini-value">87°C</div>
      </section>

      <section class="small-live batt-live">
        <div class="mini-arc">
          <svg viewBox="0 0 180 100" aria-hidden="true">
            <path class="arc-track" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
            <path id="battArc" class="arc-fill" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
          </svg>
        </div>
        <div id="battValue" class="mini-value">12.7 V</div>
      </section>

      <section class="small-live alt-live">
        <div class="mini-arc">
          <svg viewBox="0 0 180 100" aria-hidden="true">
            <path class="arc-track" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
            <path id="altArc" class="arc-fill" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
          </svg>
        </div>
        <div id="altValue" class="mini-value">14.2 V</div>
      </section>

      <section class="small-live fuel-live">
        <div class="mini-arc fuel-arc">
          <svg viewBox="0 0 180 100" aria-hidden="true">
            <path class="arc-track" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
            <path id="fuelArc" class="arc-fill" pathLength="100" d="M10 90 A80 80 0 0 1 170 90"/>
          </svg>
        </div>
        <div id="fuelValue" class="mini-value">64%</div>
      </section>

      <!-- Simple interactive overlays -->
      <div class="brand-hotspots" aria-label="Vehicle selector">
        <button data-brand="Toyota" style="--x:0"></button>
        <button data-brand="Lexus" class="active" style="--x:1"></button>
        <button data-brand="Nissan" style="--x:2"></button>
        <button data-brand="Honda" style="--x:3"></button>
        <button data-brand="Mercedes" style="--x:4"></button>
        <button data-brand="GMC" style="--x:5"></button>
        <button data-brand="Ford" style="--x:6"></button>
      </div>

      <div class="control-hotspots">
        <button id="liveBtn" class="hot live" aria-label="Live Data"></button>
        <button id="remoteBtn" class="hot remote" aria-label="Remote Start"></button>
        <button id="lockBtn" class="hot lock" aria-label="Lock"></button>
        <button id="unlockBtn" class="hot unlock" aria-label="Unlock"></button>
      </div>

      <div class="battery-controls">
        <button id="minusBtn" aria-label="خفض حد البطارية">−</button>
        <span id="batteryLimit">11.0 V</span>
        <button id="plusBtn" aria-label="رفع حد البطارية">+</button>
      </div>

      <div id="demoBadge">LIVE TEST</div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script>
// Alketbi editable demo dashboard
// Current values are SIMULATED. Replace this data source with approved OBD data later.

let running = true;
let batteryLimit = 11.0;

let state = {
  rpm: 1650,
  speed: 72,
  temp: 87,
  batt: 12.7,
  alt: 14.2,
  fuel: 64
};

const $ = id => document.getElementById(id);

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

function setArc(id,fraction){
  fraction = clamp(fraction,0,1);
  $(id).style.strokeDashoffset = (100 * (1 - fraction)).toFixed(1);
}

function render(){
  $('rpmValue').textContent = Math.round(state.rpm);
  $('speedValue').textContent = Math.round(state.speed);
  $('tempValue').textContent = Math.round(state.temp) + '°C';
  $('battValue').textContent = state.batt.toFixed(1) + ' V';
  $('altValue').textContent = state.alt.toFixed(1) + ' V';
  $('fuelValue').textContent = Math.round(state.fuel) + '%';

  setArc('rpmArc', state.rpm / 7000);
  setArc('speedArc', state.speed / 240);
  setArc('tempArc', (state.temp - 50) / 80);
  setArc('battArc', (state.batt - 10) / 5);
  setArc('altArc', (state.alt - 10) / 6);
  setArc('fuelArc', state.fuel / 100);
}

function tick(){
  if(!running) return;
  state.rpm = clamp(state.rpm + Math.round((Math.random()-.5)*150),700,4200);
  state.speed = clamp(state.speed + Math.round((Math.random()-.5)*5),0,140);
  state.temp = clamp(state.temp + (Math.random()-.5)*2.3,82,98);
  state.batt = clamp(state.batt + (Math.random()-.5)*.25,12.2,13.0);
  state.alt = clamp(state.alt + (Math.random()-.5)*.28,13.7,14.7);
  state.fuel = clamp(state.fuel + Math.round((Math.random()-.5)*2),5,100);
  render();
}

function toast(message){
  const t=$('toast');
  t.textContent=message;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

// Vehicle-brand selector demo
document.querySelectorAll('.brand-hotspots button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.brand-hotspots button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    toast('تم اختيار ' + btn.dataset.brand);
  });
});

// Live simulation start/pause
$('liveBtn').addEventListener('click',()=>{
  running=!running;
  toast(running ? 'LIVE TEST يعمل' : 'تم إيقاف البيانات التجريبية');
});

// These three remain demo-only. Do not connect them to vehicle security systems here.
$('remoteBtn').addEventListener('click',()=>toast('Remote Start: DEMO ONLY'));
$('lockBtn').addEventListener('click',()=>toast('Lock: DEMO ONLY'));
$('unlockBtn').addEventListener('click',()=>toast('Unlock: DEMO ONLY'));

// Battery alert threshold
function showLimit(){
  $('batteryLimit').textContent = batteryLimit.toFixed(1) + ' V';
}
$('minusBtn').addEventListener('click',()=>{
  batteryLimit=clamp(batteryLimit-.1,9.0,13.0);
  showLimit();
});
$('plusBtn').addEventListener('click',()=>{
  batteryLimit=clamp(batteryLimit+.1,9.0,13.0);
  showLimit();
});

render();
showLimit();
setInterval(tick,1200);

</script>

    <div class="badge">LIVE TEST</div>
  </div>
</div>
<script>
let r=1750,s=70;
setInterval(()=>{
  r=Math.max(700,Math.min(4200,r+Math.round((Math.random()-.5)*90)));
  s=Math.max(0,Math.min(140,s+Math.round((Math.random()-.5)*3)));
  document.getElementById('rpm').textContent=r;
  document.getElementById('speed').textContent=s;
},1200);
</script>
</body>
</html>

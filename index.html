<title>alketbi Live Dashboard</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
}
#wrap{
  width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#02070c;
}
#board{
  position:relative;width:min(100vw,216.67vh);aspect-ratio:1846/852;overflow:hidden;
}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}

.liveNum{
  position:absolute;z-index:5;color:#fff;font-weight:900;text-align:center;
  line-height:1;text-shadow:0 0 12px rgba(40,170,255,.75);
}
#rpm{left:22.0%;top:41.2%;width:10.3%;font-size:4.25vw}
#speed{left:69.4%;top:41.2%;width:8.2%;font-size:4.25vw}

.valueMask{
  position:absolute;z-index:4;border-radius:.7vw;
  background:radial-gradient(circle at 50% 10%,#0a263a 0%,#061924 45%,#04121b 100%);
}
#rpmMask{left:21.8%;top:40.2%;width:10.7%;height:10.8%}
#speedMask{left:69.1%;top:40.1%;width:8.8%;height:10.9%}

.smallMask{
  position:absolute;z-index:3;border-radius:.55vw;
  background:linear-gradient(180deg,#071a25 0%,#061722 100%);
}
#mTemp{left:18.45%;top:60.5%;width:8.85%;height:12.9%}
#mBatt{left:28.55%;top:60.5%;width:8.75%;height:12.9%}
#mAlt{left:38.72%;top:60.5%;width:8.58%;height:12.9%}
#mFuel{left:48.42%;top:60.5%;width:8.95%;height:12.9%}

.gauge{
  position:absolute;z-index:6;height:9.8%;pointer-events:none;
}
.gauge svg{width:100%;height:100%;overflow:visible}
.gauge .track{
  fill:none;stroke:#1a3a5d;stroke-width:10;stroke-linecap:round;
}
.gauge .fill{
  fill:none;stroke-width:10;stroke-linecap:round;
  stroke-dasharray:132;stroke-dashoffset:45;transition:stroke-dashoffset .65s ease;
}
#gTemp{left:18.75%;top:61.2%;width:8.25%}
#gBatt{left:28.85%;top:61.2%;width:8.15%}
#gAlt{left:39.02%;top:61.2%;width:8.00%}
#gFuel{left:48.78%;top:61.2%;width:8.25%}
#gTemp .fill,#gBatt .fill,#gAlt .fill{stroke:#19efa0;filter:drop-shadow(0 0 4px #19efa0)}
#gFuel .fill{stroke:#44c9ff;filter:drop-shadow(0 0 4px #44c9ff)}

.smallValue{
  position:absolute;z-index:7;color:#fff;font-weight:900;text-align:center;
  font-size:1.75vw;line-height:1;white-space:nowrap;text-shadow:0 0 9px rgba(40,170,255,.45);
}
#tempVal{left:19.38%;top:69.35%;width:7.05%}
#battVal{left:29.44%;top:69.35%;width:7.05%}
#altVal{left:39.58%;top:69.35%;width:7.05%}
#fuelVal{left:49.39%;top:69.35%;width:7.05%}

.badge{
  position:absolute;z-index:9;right:1.55%;top:1.55%;padding:.30vw .60vw;
  border:1px solid #19bfff;border-radius:.45vw;background:rgba(2,15,24,.78);
  color:#64d8ff;font-size:.72vw;font-weight:800;letter-spacing:.05em;
}
</style>

<script>
let rpm=1615, speed=76, temp=87, batt=12.7, alt=14.3, fuel=65;

function setArc(id, fraction){
  fraction=Math.max(0,Math.min(1,fraction));
  document.getElementById(id).style.strokeDashoffset=(132*(1-fraction)).toFixed(1);
}

function draw(){
  document.getElementById('rpm').textContent=Math.round(rpm);
  document.getElementById('speed').textContent=Math.round(speed);
  document.getElementById('tempVal').textContent=Math.round(temp)+'°C';
  document.getElementById('battVal').textContent=batt.toFixed(1)+' V';
  document.getElementById('altVal').textContent=alt.toFixed(1)+' V';
  document.getElementById('fuelVal').textContent=Math.round(fuel)+'%';

  setArc('tempFill',(temp-70)/60);
  setArc('battFill',(batt-10)/5);
  setArc('altFill',(alt-10)/6);
  setArc('fuelFill',fuel/100);
}

draw();

setInterval(()=>{
  rpm=Math.max(700,Math.min(4200,rpm+Math.round((Math.random()-.5)*120)));
  speed=Math.max(0,Math.min(140,speed+Math.round((Math.random()-.5)*5)));
  temp=Math.max(82,Math.min(98,temp+(Math.random()-.5)*2.6));
  batt=Math.max(12.2,Math.min(13.0,batt+(Math.random()-.5)*0.30));
  alt=Math.max(13.7,Math.min(14.7,alt+(Math.random()-.5)*0.35));
  fuel=Math.max(5,Math.min(100,fuel+Math.round((Math.random()-.5)*3)));
  draw();
},1200);
</script>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>alketbi Final Dashboard</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
}
#wrap{
  width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;
  background:#02070c;
}
#board{
  position:relative;
  width:min(100vw,216.67vh);
  aspect-ratio:1846/852;
  overflow:hidden;
  background:#02070c;
}
#bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}

.mask{
  position:absolute;z-index:6;
  background:radial-gradient(circle at 50% 15%,#0a2638 0%,#061924 50%,#04131c 100%);
  border-radius:.7vw;
}
.liveValue{
  position:absolute;z-index:7;color:#fff;font-weight:900;text-align:center;
  white-space:nowrap;line-height:1;text-shadow:0 0 10px rgba(43,173,255,.6);
}

/* Large live values */
#rpmMask{left:22.05%;top:40.55%;width:9.10%;height:9.75%}
#speedMask{left:69.55%;top:40.55%;width:7.25%;height:9.75%}
#rpm{left:22.05%;top:41.25%;width:9.10%;font-size:4.0vw}
#speed{left:69.55%;top:41.25%;width:7.25%;font-size:4.0vw}

/* Small value masks */
#tempMask{left:20.42%;top:68.55%;width:5.05%;height:4.90%}
#battMask{left:30.32%;top:68.55%;width:6.05%;height:4.90%}
#altMask{left:40.72%;top:68.55%;width:5.90%;height:4.90%}
#fuelMask{left:50.27%;top:68.55%;width:5.20%;height:4.90%}

#tempVal{left:20.42%;top:69.00%;width:5.05%;font-size:1.68vw}
#battVal{left:30.32%;top:69.00%;width:6.05%;font-size:1.68vw}
#altVal{left:40.72%;top:69.00%;width:5.90%;font-size:1.68vw}
#fuelVal{left:50.27%;top:69.00%;width:5.20%;font-size:1.68vw}

/* Gauge overlays. The dark "cover" stroke hides the gauge painted in the background image,
   then the new track/fill is drawn above it. */
.gauge{
  position:absolute;z-index:5;pointer-events:none;
}
.gauge svg{width:100%;height:100%;overflow:visible}
.coverStroke{
  fill:none;stroke:#071a27;stroke-width:18;stroke-linecap:round;
}
.trackStroke{
  fill:none;stroke:#173854;stroke-width:10;stroke-linecap:round;
}
.fillStroke{
  fill:none;stroke-width:10;stroke-linecap:round;
  transition:stroke-dashoffset .75s ease;
}

/* Large gauges */
#rpmGauge{left:19.25%;top:32.95%;width:14.55%;height:15.75%}
#speedGauge{left:65.35%;top:32.95%;width:14.55%;height:15.75%}
.bigGauge .coverStroke,.bigGauge .trackStroke,.bigGauge .fillStroke{stroke-width:9}
.bigGauge .coverStroke{stroke-width:16}
#rpmFill{stroke:#19efa0;filter:drop-shadow(0 0 4px #19efa0)}
#speedFill{stroke:#37cfff;filter:drop-shadow(0 0 4px #37cfff)}

/* Small gauges */
#tempGauge{left:18.63%;top:59.55%;width:8.55%;height:11.10%}
#battGauge{left:28.55%;top:59.55%;width:8.55%;height:11.10%}
#altGauge{left:38.62%;top:59.55%;width:8.55%;height:11.10%}
#fuelGauge{left:48.55%;top:59.55%;width:8.55%;height:11.10%}

#tempFill,#battFill,#altFill{stroke:#19efa0;filter:drop-shadow(0 0 4px #19efa0)}
#fuelFill{stroke:#43c8ff;filter:drop-shadow(0 0 4px #43c8ff)}

.badge{
  position:absolute;right:1.55%;top:1.55%;z-index:10;
  padding:.30vw .62vw;border:1px solid #19bfff;border-radius:.45vw;
  background:rgba(2,15,24,.80);color:#64d8ff;font-size:.72vw;font-weight:800;
}
</style>

<script>
let rpm=1615, speed=76, temp=87, batt=12.7, alt=14.3, fuel=65;

const ARC = 141.4; // approximate semicircle length for this SVG path

function setArc(id, fraction){
  fraction=Math.max(0,Math.min(1,fraction));
  const el=document.getElementById(id);
  el.style.strokeDasharray=ARC;
  el.style.strokeDashoffset=(ARC*(1-fraction)).toFixed(1);
}

function draw(){
  document.getElementById('rpm').textContent=Math.round(rpm);
  document.getElementById('speed').textContent=Math.round(speed);
  document.getElementById('tempVal').textContent=Math.round(temp)+'°C';
  document.getElementById('battVal').textContent=batt.toFixed(1)+' V';
  document.getElementById('altVal').textContent=alt.toFixed(1)+' V';
  document.getElementById('fuelVal').textContent=Math.round(fuel)+'%';

  setArc('rpmFill',rpm/7000);
  setArc('speedFill',speed/240);
  setArc('tempFill',(temp-50)/80);
  setArc('battFill',(batt-10)/5);
  setArc('altFill',(alt-10)/6);
  setArc('fuelFill',fuel/100);
}

draw();

setInterval(()=>{
  rpm=Math.max(700,Math.min(4200,rpm+Math.round((Math.random()-.5)*120)));
  speed=Math.max(0,Math.min(140,speed+Math.round((Math.random()-.5)*5)));
  temp=Math.max(82,Math.min(98,temp+(Math.random()-.5)*2.4));
  batt=Math.max(12.2,Math.min(13.0,batt+(Math.random()-.5)*0.30));
  alt=Math.max(13.7,Math.min(14.7,alt+(Math.random()-.5)*0.35));
  fuel=Math.max(5,Math.min(100,fuel+Math.round((Math.random()-.5)*3)));
  draw();
},1200);
</script>

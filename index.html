<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02070c">
  <title>alketbi</title>
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#02070c;
      overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif
    }
    #viewport{
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:#02070c
    }
    #stage{
      position:relative;
      width:1536px;
      height:864px;
      transform-origin:top left
    }
    .dashboard-bg{
      position:absolute;
      inset:0;
      width:1536px;
      height:864px;
      display:block;
      user-select:none;
      -webkit-user-drag:none
    }
    .hotspot{
      position:absolute;
      border:0;
      background:transparent;
      border-radius:12px;
      cursor:pointer
    }
    .hotspot:active{
      background:rgba(52,168,255,.12);
      box-shadow:0 0 24px rgba(0,150,255,.45) inset
    }
    .cover{
      position:absolute;
      background:linear-gradient(180deg,rgba(8,22,38,.98),rgba(5,16,28,.98));
      border-radius:20px;
      box-shadow:inset 0 0 18px rgba(16,111,179,.22)
    }
    .rpm-cover{left:305px;top:324px;width:238px;height:105px}
    .speed-cover{left:1030px;top:323px;width:173px;height:104px}
    .live-number{
      position:absolute;
      color:#fff;
      font-weight:900;
      line-height:1;
      text-shadow:0 0 18px rgba(45,167,255,.95);
      text-align:center
    }
    .rpm-number{left:305px;top:326px;width:238px;font-size:82px}
    .speed-number{left:1030px;top:326px;width:173px;font-size:82px}
    .live-unit{
      position:absolute;
      color:#c8e8ff;
      font-weight:800;
      text-align:center
    }
    .rpm-unit{left:355px;top:406px;width:140px;font-size:20px}
    .speed-unit{left:1045px;top:406px;width:140px;font-size:20px}
    .toast{
      position:absolute;
      left:50%;
      bottom:18px;
      transform:translateX(-50%) translateY(12px);
      padding:11px 16px;
      border-radius:14px;
      background:rgba(4,16,26,.95);
      border:1px solid #168dd1;
      color:#fff;
      font-size:17px;
      opacity:0;
      transition:.2s;
      white-space:nowrap;
      pointer-events:none
    }
    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0)
    }
  </style>
</head>
<body>
  <main id="viewport">
    <div id="stage">
      <img class="dashboard-bg"
           src="https://alketbi-2026.github.io/Alketbi-2026/dashboard.jpg?v=500"
           alt="alketbi dashboard">

      <div class="cover rpm-cover"></div>
      <div class="live-number rpm-number" id="rpmValue">1750</div>
      <div class="live-unit rpm-unit">RPM</div>

      <div class="cover speed-cover"></div>
      <div class="live-number speed-number" id="speedValue">70</div>
      <div class="live-unit speed-unit">km/h</div>

      <button class="hotspot" style="left:9px;top:102px;width:242px;height:80px" data-msg="الرئيسية"></button>
      <button class="hotspot" style="left:9px;top:187px;width:242px;height:80px" data-msg="البيانات الحية"></button>
      <button class="hotspot" style="left:9px;top:272px;width:242px;height:80px" data-msg="تشخيص الأعطال"></button>

      <button class="hotspot" style="left:756px;top:660px;width:112px;height:122px" data-msg="التشغيل عن بُعد: تجريبي حتى ربط وحدة معتمدة"></button>
      <button class="hotspot" style="left:878px;top:660px;width:112px;height:122px" data-msg="القفل: تجريبي"></button>
      <button class="hotspot" style="left:998px;top:660px;width:112px;height:122px" data-msg="الفتح: تجريبي"></button>

      <div id="toast" class="toast"></div>
    </div>
  </main>

  <script>
    const DESIGN_W=1536, DESIGN_H=864;
    const stage=document.getElementById('stage');
    function fitStage(){
      const s=Math.min(innerWidth/DESIGN_W,innerHeight/DESIGN_H);
      const sw=DESIGN_W*s, sh=DESIGN_H*s;
      stage.style.transform=`scale(${s})`;
      stage.style.marginLeft=Math.max(0,(innerWidth-sw)/2)+'px';
      stage.style.marginTop=Math.max(0,(innerHeight-sh)/2)+'px';
    }
    addEventListener('resize',fitStage);
    addEventListener('orientationchange',()=>setTimeout(fitStage,150));
    fitStage();

    const toast=document.getElementById('toast');
    let tt;
    function showToast(msg){
      clearTimeout(tt);
      toast.textContent=msg;
      toast.classList.add('show');
      tt=setTimeout(()=>toast.classList.remove('show'),1600);
    }
    document.querySelectorAll('.hotspot[data-msg]').forEach(b=>{
      b.addEventListener('click',()=>showToast(b.dataset.msg));
    });

    let rpm=1750, speed=70;
    const rpmEl=document.getElementById('rpmValue');
    const speedEl=document.getElementById('speedValue');
    setInterval(()=>{
      rpm=Math.max(700,Math.min(4200,rpm+Math.round((Math.random()-.5)*90)));
      speed=Math.max(0,Math.min(140,speed+Math.round((Math.random()-.5)*3)));
      rpmEl.textContent=rpm;
      speedEl.textContent=speed;
    },1200);
  </script>
</body>
</html>
